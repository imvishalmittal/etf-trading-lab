name: XR3 - Unified defensive rotation research

on:
  pull_request:
    paths:
      - 'src/nifty-etf-multi/**'
      - 'scripts/acquire-nifty-etf-xr3.mjs'
      - 'scripts/run-nifty-etf-xr3.mjs'
      - 'tests/nifty-etf-multi/**'
      - 'research/nifty-etf-xr3/**'
      - '.github/workflows/nifty-etf-xr3.yml'
      - 'package.json'
  push:
    branches: [main]
    paths: ['research/nifty-etf-xr3/RUN_TRIGGER']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nifty-etf-xr3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  research:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Resolve read-only Kite session
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_REQUEST_TOKEN: ${{ secrets.KITE_REQUEST_TOKEN }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/resolve-kite-token.mjs
      - name: Acquire frozen expanded-universe daily data
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: npm run research:nifty-etf-xr3:data
      - name: Verify acquired data
        run: cd artifacts/nifty-etf-xr3/data && sha256sum -c checksums.sha256
      - name: Calculate discovery, validation, and holdout together
        run: npm run research:nifty-etf-xr3:run -- --data-dir=artifacts/nifty-etf-xr3/data
      - name: Verify result artifact
        if: success()
        run: cd artifacts/nifty-etf-xr3/results && sha256sum -c checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty-etf-xr3-${{ github.sha }}
          path: artifacts/nifty-etf-xr3
          if-no-files-found: error
          retention-days: 30

