name: NIFTY-ETF-M1 - Sealed holdout
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: nifty-etf-m1-holdout
  cancel-in-progress: false
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Require committed passing validation gate
        run: node -e "const g=require('./research/nifty-etf-m1/evidence/validation/gate.json'); if(g.decision!=='PASS') process.exit(1)"
      - name: Resolve read-only Kite session
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_REQUEST_TOKEN: ${{ secrets.KITE_REQUEST_TOKEN }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/resolve-kite-token.mjs
      - name: Run sealed 2026 holdout
        env:
          MARKET_DATA_SOURCE: kite
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: npm run research:nifty-etf-m1:holdout
      - name: Verify artifact checksums
        run: cd artifacts/nifty-etf-m1/holdout && sha256sum -c checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty-etf-m1-holdout-${{ github.sha }}
          path: artifacts/nifty-etf-m1/holdout
          if-no-files-found: error
          retention-days: 30
