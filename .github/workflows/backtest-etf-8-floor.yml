name: Backtest ETF-8 floor
on:
  push:
    branches: [main]
    paths: [requests/run-etf-8-floor.json]
  workflow_dispatch:
    inputs:
      end_date:
        description: End date (YYYY-MM-DD); blank uses current IST date
        required: false
permissions: { contents: read }
concurrency: { group: groww-etf-research, cancel-in-progress: false }
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run backtest:floor
        env:
          BACKTEST_END: ${{ inputs.end_date }}
      - uses: actions/upload-artifact@v4
        with:
          name: etf-8-floor-results
          path: research/etf-8-floor-2y.json
          retention-days: 30
