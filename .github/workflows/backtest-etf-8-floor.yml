name: Backtest ETF-8 floor
on:
  push:
    branches: [main]
    paths: [requests/run-etf-8-floor.json]
  workflow_dispatch:
    inputs:
      end_date:
        description: End date (YYYY-MM-DD); blank uses current IST date
        required: false
permissions: { contents: write }
concurrency: { group: groww-etf-research, cancel-in-progress: false }
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/resolve-groww-token.mjs
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
      - run: npm run backtest:floor
        env:
          BACKTEST_END: ${{ inputs.end_date }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/etf-8-floor-2y.json
          git commit -m "Update ETF-8 floor backtest" || exit 0
          git push
