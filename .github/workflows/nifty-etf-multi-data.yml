name: Multi-ETF - Frozen discovery data acquisition
on:
  pull_request:
    paths:
      - 'research/nifty-etf-multi/**'
      - 'scripts/acquire-nifty-etf-multi.mjs'
      - 'src/nifty-etf-m1/kite-data.mjs'
      - 'tests/nifty-etf-multi/**'
      - '.github/workflows/nifty-etf-multi-data.yml'
      - 'package.json'
  push:
    branches: [main]
    paths: ['research/nifty-etf-multi/DATA_TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nifty-etf-multi-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  acquire:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Resolve read-only Kite session
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_REQUEST_TOKEN: ${{ secrets.KITE_REQUEST_TOKEN }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: node scripts/resolve-kite-token.mjs
      - name: Acquire frozen discovery data only
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: npm run research:nifty-etf-multi:data
      - run: cd artifacts/nifty-etf-multi/discovery-data && sha256sum -c checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty-etf-multi-discovery-data-${{ github.sha }}
          path: artifacts/nifty-etf-multi/discovery-data
          if-no-files-found: error
          retention-days: 30
